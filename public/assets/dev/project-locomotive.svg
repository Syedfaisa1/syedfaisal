<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="100%" height="100%">
  <defs>
    <linearGradient id="p1Grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="60%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </radialGradient>
  </defs>

  <!-- Card Frame -->
  <rect x="8" y="8" width="384" height="264" rx="16" fill="url(#p1Grad)" stroke="#334155" stroke-width="2"/>

  <!-- 3D Grid Perspective Plane -->
  <g stroke="#38bdf8" stroke-opacity="0.18" stroke-width="1">
    <line x1="20" y1="200" x2="380" y2="200"/>
    <line x1="40" y1="220" x2="360" y2="220"/>
    <line x1="70" y1="240" x2="330" y2="240"/>
    <line x1="110" y1="255" x2="290" y2="255"/>

    <line x1="200" y1="120" x2="40" y2="255"/>
    <line x1="200" y1="120" x2="100" y2="255"/>
    <line x1="200" y1="120" x2="160" y2="255"/>
    <line x1="200" y1="120" x2="200" y2="255"/>
    <line x1="200" y1="120" x2="240" y2="255"/>
    <line x1="200" y1="120" x2="300" y2="255"/>
    <line x1="200" y1="120" x2="360" y2="255"/>
  </g>

  <!-- Floating 3D Physics Sphere -->
  <circle cx="160" cy="110" r="54" fill="url(#sphereGrad)" stroke="#93c5fd" stroke-width="1.5"/>
  <!-- Wireframe Latitude/Longitude on Sphere -->
  <ellipse cx="160" cy="110" rx="54" ry="24" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>
  <ellipse cx="160" cy="110" rx="24" ry="54" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1"/>

  <!-- Secondary Kinetic Cubes -->
  <g transform="translate(260, 80) rotate(22)">
    <rect x="-24" y="-24" width="48" height="48" rx="6" fill="#3b82f6" fill-opacity="0.8" stroke="#93c5fd" stroke-width="1.5"/>
  </g>
  <g transform="translate(90, 160) rotate(-18)">
    <rect x="-18" y="-18" width="36" height="36" rx="4" fill="#60a5fa" fill-opacity="0.7" stroke="#bfdbfe" stroke-width="1.5"/>
  </g>

  <!-- Tag Badges -->
  <rect x="24" y="24" width="130" height="24" rx="6" fill="#2563eb" fill-opacity="0.3" stroke="#3b82f6" stroke-width="1"/>
  <text x="34" y="40" fill="#60a5fa" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">● THREE.JS + RAPIER</text>

  <rect x="270" y="24" width="104" height="24" rx="6" fill="#000000" fill-opacity="0.5" stroke="#475569" stroke-width="1"/>
  <text x="322" y="40" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" text-anchor="middle">60 FPS FLUID</text>
</svg>
