<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 480" width="100%" height="100%">
  <defs>
    <filter id="phoneShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="phoneBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16181f"/>
      <stop offset="100%" stop-color="#090a0e"/>
    </linearGradient>
    <linearGradient id="accentCard" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#013900"/>
      <stop offset="100%" stop-color="#045d03"/>
    </linearGradient>
  </defs>

  <!-- Phone Container -->
  <rect x="14" y="14" width="352" height="452" rx="36" fill="url(#phoneBody)" stroke="#272a36" stroke-width="3" filter="url(#phoneShadow)"/>

  <!-- Dynamic Island -->
  <rect x="135" y="26" width="110" height="24" rx="12" fill="#000000"/>
  <circle cx="225" cy="38" r="4.5" fill="#111827"/>
  <circle cx="225" cy="38" r="2" fill="#1e3a8a"/>

  <!-- Status Bar Time & Icons -->
  <text x="46" y="42" fill="#e2e8f0" font-family="-apple-system, sans-serif" font-size="11" font-weight="700">9:41</text>
  <g transform="translate(305, 33)" fill="#e2e8f0">
    <!-- Wifi & Battery -->
    <rect x="12" y="3" width="18" height="9" rx="2" fill="none" stroke="#e2e8f0" stroke-width="1.2"/>
    <rect x="14" y="5" width="12" height="5" rx="1" fill="#b6fe00"/>
    <rect x="30" y="6" width="1.5" height="3" rx="0.5" fill="#e2e8f0"/>
  </g>

  <!-- App Header -->
  <text x="36" y="86" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" letter-spacing="1">
    PORTFOLIO V2
  </text>
  <text x="36" y="112" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="20" font-weight="800">
    Tactile Architecture
  </text>

  <!-- Hero Card Inside Mobile -->
  <rect x="36" y="130" width="308" height="150" rx="18" fill="url(#accentCard)" stroke="#b6fe00" stroke-width="1.5"/>
  <text x="56" y="160" fill="#b6fe00" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">
    ● 60 FPS INTERACTIVE ENGINE
  </text>
  <text x="56" y="190" fill="#ffffff" font-family="sans-serif" font-size="16" font-weight="800">
    Zero-Jank Web Experiences
  </text>
  <text x="56" y="214" fill="#a3e635" font-family="sans-serif" font-size="11" opacity="0.9">
    Kinetic physics, GSAP timelines &amp; Three.js
  </text>

  <!-- Interactive Button inside Mobile -->
  <rect x="56" y="232" width="130" height="32" rx="16" fill="#b6fe00"/>
  <text x="121" y="253" fill="#013900" font-family="sans-serif" font-size="11" font-weight="800" text-anchor="middle">
    VIEW DEMO ↗
  </text>

  <!-- Metrics Grid Inside Mobile -->
  <rect x="36" y="296" width="146" height="80" rx="14" fill="#1c1f2b" stroke="#2a3040" stroke-width="1"/>
  <text x="50" y="320" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">FRAME TIME</text>
  <text x="50" y="348" fill="#38bdf8" font-family="sans-serif" font-size="22" font-weight="800">16.6ms</text>
  <text x="50" y="366" fill="#34d399" font-family="sans-serif" font-size="9" font-weight="600">✓ Butter-smooth</text>

  <rect x="198" y="296" width="146" height="80" rx="14" fill="#1c1f2b" stroke="#2a3040" stroke-width="1"/>
  <text x="212" y="320" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600">LIGHTHOUSE</text>
  <text x="212" y="348" fill="#b6fe00" font-family="sans-serif" font-size="22" font-weight="800">100/100</text>
  <text x="212" y="366" fill="#b6fe00" font-family="sans-serif" font-size="9" font-weight="600">★ Maximum Perf</text>

  <!-- Bottom Home Indicator -->
  <rect x="125" y="446" width="130" height="4" rx="2" fill="#ffffff" opacity="0.4"/>
</svg>
