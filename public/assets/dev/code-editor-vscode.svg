  </text>
  <line x1="10" y1="77" x2="510" y2="77" stroke="#1e222d" stroke-width="1"/>

  <!-- Code Editor Body -->
  <g font-family="'JetBrains Mono', 'Fira Code', 'Consolas', monospace" font-size="11.5" letter-spacing="0">
