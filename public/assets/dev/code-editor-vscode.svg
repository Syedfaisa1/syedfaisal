    <!-- Code Content -->
    <!-- Line 1: Comment -->
    <text x="58" y="100" fill="#6ee7b7" font-style="italic">// ✦ modular architecture &amp; living physics</text>

    <!-- Line 2: Imports -->
    <text x="58" y="119">
      <tspan fill="#f43f5e" font-weight="600">import</tspan> <tspan fill="#e2e8f0">{ gsap }</tspan> <tspan fill="#f43f5e" font-weight="600">from</tspan> <tspan fill="#38bdf8">'gsap'</tspan>
    </text>

    <!-- Line 3: Interface -->
    <text x="58" y="138">
      <tspan fill="#818cf8" font-weight="600">export interface</tspan> <tspan fill="#38bdf8" font-weight="700">PhysicsEngine</tspan> <tspan fill="#e2e8f0">{</tspan>
    </text>

    <!-- Line 4: Field -->
    <text x="74" y="157">
      <tspan fill="#94a3b8">targetFps:</tspan> <tspan fill="#f59e0b">60</tspan><tspan fill="#e2e8f0">;</tspan> <tspan fill="#94a3b8">zeroJank:</tspan> <tspan fill="#f43f5e">true</tspan><tspan fill="#e2e8f0">;</tspan>
    </text>

    <!-- Line 5: Close interface -->
    <text x="58" y="176" fill="#e2e8f0">}</text>

    <!-- Line 6: Empty / Hook -->
    <text x="58" y="195">
      <tspan fill="#818cf8" font-weight="600">export const</tspan> <tspan fill="#facc15" font-weight="600">initLivingPhysics</tspan> <tspan fill="#e2e8f0">= () =&gt; {</tspan>
    </text>

    <!-- Line 7: State -->
    <text x="74" y="214">
      <tspan fill="#818cf8">const</tspan> <tspan fill="#e2e8f0">spring</tspan> <tspan fill="#f43f5e">=</tspan> <tspan fill="#38bdf8">createSpring</tspan><tspan fill="#e2e8f0">({ stiffness:</tspan> <tspan fill="#f59e0b">280</tspan><tspan fill="#e2e8f0">, damping:</tspan> <tspan fill="#f59e0b">18</tspan> <tspan fill="#e2e8f0">})</tspan>
    </text>

    <!-- Line 8: GSAP Timeline -->
    <text x="74" y="233">
      <tspan fill="#818cf8">const</tspan> <tspan fill="#e2e8f0">tl</tspan> <tspan fill="#f43f5e">=</tspan> <tspan fill="#e2e8f0">gsap.</tspan><tspan fill="#38bdf8">timeline</tspan><tspan fill="#e2e8f0">({ smoothChildTiming:</tspan> <tspan fill="#f43f5e">true</tspan> <tspan fill="#e2e8f0">})</tspan>
    </text>

    <!-- Line 9: Transform Loop -->
    <text x="74" y="252">
      <tspan fill="#e2e8f0">tl.</tspan><tspan fill="#38bdf8">to</tspan><tspan fill="#e2e8f0">(cards, { yPercent:</tspan> <tspan fill="#f59e0b">0</tspan><tspan fill="#e2e8f0">, ease:</tspan> <tspan fill="#38bdf8">'none'</tspan> <tspan fill="#e2e8f0">})</tspan>
    </text>

    <!-- Line 10: Return -->
    <text x="74" y="271">
      <tspan fill="#f43f5e" font-weight="600">return</tspan> <tspan fill="#e2e8f0">{ status:</tspan> <tspan fill="#34d399">'READY_60FPS'</tspan><tspan fill="#e2e8f0">, spring }</tspan>
    </text>

    <!-- Line 11: Close bracket -->
    <text x="58" y="290" fill="#e2e8f0">}</text>

    <!-- Active Line Highlight on Line 12 -->
    <rect x="49" y="298" width="410" height="18" fill="#38bdf8" opacity="0.08"/>
    <text x="58" y="309">
      <tspan fill="#f43f5e" font-weight="600">export default</tspan> <tspan fill="#facc15">initLivingPhysics</tspan>
    </text>

